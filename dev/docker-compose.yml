# Local WordPress for developing and testing asm-wp-plugin.
# Use dev/bin/dev (see README) rather than calling docker compose directly.
name: asm-wp-plugin-dev

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ASM_DEV_WP_PORT:-8888}:80"
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      ASM_DEV_MOCK_PORT: "${ASM_DEV_MOCK_PORT:-8889}"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
    volumes: &wp-volumes
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/asm-wp-plugin
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./themes/asm-wp-plugin-demo:/var/www/html/wp-content/themes/asm-wp-plugin-demo:ro

  # wp-cli. Runs as uid 33, the owner of the WordPress files in the web container.
  cli:
    build: .
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      - wordpress
    environment: *wp-env
    volumes: *wp-volumes

  # Composer, PHPUnit and PHPCS. Runs as your own user so files it writes
  # into the repo (vendor/, the .pot file) belong to you.
  tools:
    build: .
    profiles: ["tools"]
    user: "${ASM_DEV_UID:-1000}:${ASM_DEV_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    working_dir: /var/www/html/wp-content/plugins/asm-wp-plugin
    environment:
      <<: *wp-env
      COMPOSER_HOME: /tmp/composer
      WP_PHPUNIT__TESTS_CONFIG: /var/www/html/wp-content/plugins/asm-wp-plugin/tests/wp-tests-config.php
    volumes: *wp-volumes

  # Stand-in for the Animal Shelter Manager service, serving made-up animals.
  asm-mock:
    image: php:8.3-cli-alpine
    command: ["php", "-S", "0.0.0.0:8889", "/mock/router.php"]
    ports:
      - "${ASM_DEV_MOCK_PORT:-8889}:8889"
    volumes:
      - ./asm-mock:/mock:ro

volumes:
  db:
  wp:
